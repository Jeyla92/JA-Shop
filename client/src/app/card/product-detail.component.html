<div class="product-detail" *ngIf="product">
    <img class="product-image" [src]="product.imageUrl" [alt]="product.name" />
  
    <div class="product-info">
      <h2>{{ product.name }}</h2>
      <p class="brand">{{ product.brand }}</p>
      <p class="description">{{ product.description }}</p>
      <p class="price">{{ product.price }} SEK</p>
  
      <button (click)="addToCart(product)">Lägg i varukorg</button>
    </div>
  </div>
  
 
  
  
  <!-- Liknande produkter -->
  <div class="similar-products" *ngIf="similarProducts.length > 0">
    <h3>Liknande produkter</h3>
    <div class="product-list">
      <div *ngFor="let p of similarProducts" class="product-card" (click)="goToProduct(p.id)">
        <img [src]="p.imageUrl" [alt]="p.name" />
        <p>{{ p.name }}</p>
        <p>{{ p.price }} SEK</p>
      </div>
    </div>
  </div>

  <app-features></app-features>
