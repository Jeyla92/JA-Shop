<div class="admin-container">
  <div class="main-content">
    <div class="sidebar">
      <ul>
        <li><a href="#">Produkt</a></li>
        <li><a href="#">Beställningar</a></li>
        <li><a href="#">Kundhantering</a></li>
        <li><a href="#">Innehållshantering</a></li>
        <li><a href="#">Support</a></li>
      </ul>
    </div>

    <div class="content-area">
      <div class="header">
        <h1>Administration</h1>
      </div>

      <div class="content-section">
        <h2 class="section-title">Produkter</h2>
        <div class="button-group">
          <button class="btn" (click)="goToNewProduct()">Ny produkt</button>
        </div>
      </div>

      <ng-container *ngIf="!loading; else loadingTemplate">
        <table *ngIf="products.length > 0; else emptyTemplate">
          <thead>
            <tr>
              <th>Titel</th>
              <th>SKU</th>
              <th>Pris</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let product of products">
              <td>{{ product.name }}</td>
              <td>{{ product.SKU }}</td>
              <td>{{ product.price }}</td>
            </tr>
          </tbody>
        </table>
      </ng-container>

      <ng-template #loadingTemplate>
        <p>Laddar produkter...</p>
      </ng-template>

      <ng-template #emptyTemplate>
        <p>Inga produkter tillgängliga.</p>
      </ng-template>
    </div>
  </div>
</div>
